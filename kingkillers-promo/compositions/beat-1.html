<template id="beat-1-template">
  <div data-composition-id="beat-1" data-width="1080" data-height="1920">
    <style>
      [data-composition-id="beat-1"] {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        position: relative;
        background: #0a0a0a;
        font-family: 'Arial', sans-serif;
      }
      .b1-flash {
        position: absolute;
        inset: 0;
        background: #DC2626;
        opacity: 0;
      }
      .b1-glow {
        position: absolute;
        width: 1000px;
        height: 1000px;
        border-radius: 50%;
        top: 45%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, rgba(220, 38, 38, 0.35) 0%, transparent 70%);
        filter: blur(80px);
      }
      .b1-glow-2 {
        position: absolute;
        width: 600px;
        height: 600px;
        border-radius: 50%;
        top: 60%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, rgba(220, 38, 38, 0.2) 0%, transparent 70%);
        filter: blur(50px);
      }
      .b1-scanlines {
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 3px,
          rgba(220, 38, 38, 0.03) 3px,
          rgba(220, 38, 38, 0.03) 4px
        );
        pointer-events: none;
      }
      .b1-impact {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 50%, rgba(220, 38, 38, 0.6) 0%, transparent 50%);
        opacity: 0;
      }
      .b1-content {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        width: 100%;
        padding: 0 60px;
        box-sizing: border-box;
      }
      .b1-headline {
        font-size: 160px;
        font-weight: 900;
        color: #ffffff;
        line-height: 1.0;
        letter-spacing: -4px;
        text-transform: uppercase;
        text-shadow: 0 0 60px rgba(220, 38, 38, 0.6);
      }
      .b1-headline-red {
        color: #DC2626;
        display: block;
        text-shadow: 0 0 80px rgba(220, 38, 38, 0.8);
      }
      .b1-sub {
        font-size: 48px;
        font-weight: 700;
        color: #a0a0a0;
        margin-top: 40px;
        letter-spacing: 8px;
        text-transform: uppercase;
      }
      .b1-border-top {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 8px;
        background: #DC2626;
      }
      .b1-border-bottom {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 8px;
        background: #DC2626;
      }
    </style>

    <div class="b1-glow"></div>
    <div class="b1-glow-2"></div>
    <div class="b1-scanlines"></div>
    <div class="b1-impact"></div>
    <div class="b1-flash"></div>
    <div class="b1-border-top"></div>
    <div class="b1-border-bottom"></div>
    <div class="b1-content">
      <div class="b1-headline">BUILT<span class="b1-headline-red">FOR FIGHTERS</span></div>
      <div class="b1-sub">Combat Sports Apparel</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Red impact flash on entry
      tl.fromTo('.b1-flash', { opacity: 1 }, { opacity: 0, duration: 0.3, ease: 'power2.out' }, 0.05);

      // Impact radial burst
      tl.fromTo('.b1-impact',
        { opacity: 0.9, scale: 0.3 },
        { opacity: 0, scale: 2, duration: 0.6, ease: 'expo.out' }, 0.05);

      // BUILT FOR FIGHTERS slams in from massive scale
      tl.fromTo('.b1-headline',
        { scale: 4, opacity: 0, rotation: -2 },
        { scale: 1, opacity: 1, rotation: 0, duration: 0.5, ease: 'expo.out' }, 0.1);

      // Subtitle slides up
      tl.fromTo('.b1-sub',
        { y: 60, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.4, ease: 'power3.out' }, 0.5);

      // Red borders slam in
      tl.fromTo('.b1-border-top',
        { scaleX: 0 },
        { scaleX: 1, duration: 0.3, ease: 'expo.out' }, 0.15);
      tl.fromTo('.b1-border-bottom',
        { scaleX: 0 },
        { scaleX: 1, duration: 0.3, ease: 'expo.out' }, 0.2);

      // Glow pulses in
      tl.fromTo('.b1-glow',
        { scale: 0.3, opacity: 0 },
        { scale: 1.3, opacity: 1, duration: 1.5, ease: 'sine.out' }, 0);
      tl.fromTo('.b1-glow-2',
        { scale: 0.5, opacity: 0 },
        { scale: 1.1, opacity: 1, duration: 1.2, ease: 'sine.out' }, 0.2);

      // Camera push on content
      tl.fromTo('.b1-content',
        { scale: 1.0 },
        { scale: 1.06, duration: 2.8, ease: 'none' }, 0.3);

      window.__timelines['beat-1'] = tl;
    </script>
  </div>
</template>
