<template id="beat-2-template">
  <div data-composition-id="beat-2" data-width="1080" data-height="1920">
    <style>
      [data-composition-id="beat-2"] {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        position: relative;
        background: #0a0a0a;
        font-family: 'Arial', sans-serif;
      }
      .b2-glow {
        position: absolute;
        width: 900px;
        height: 900px;
        border-radius: 50%;
        top: 35%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, rgba(220, 38, 38, 0.2) 0%, transparent 70%);
        filter: blur(80px);
      }
      .b2-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        padding: 200px 60px;
        gap: 50px;
        box-sizing: border-box;
      }
      .b2-tagline {
        font-size: 52px;
        font-weight: 700;
        color: #DC2626;
        text-align: center;
        letter-spacing: 6px;
        text-transform: uppercase;
      }
      .b2-category {
        font-size: 100px;
        font-weight: 900;
        color: #ffffff;
        text-align: center;
        text-transform: uppercase;
        letter-spacing: -2px;
        line-height: 1.3;
        border-left: 8px solid #DC2626;
        padding-left: 30px;
      }
      .b2-divider {
        width: 200px;
        height: 4px;
        background: #DC2626;
      }
      .b2-subtitle {
        font-size: 44px;
        font-weight: 600;
        color: #888888;
        text-align: center;
        letter-spacing: 4px;
        text-transform: uppercase;
      }
      .b2-grain {
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(255, 255, 255, 0.01) 2px,
          rgba(255, 255, 255, 0.01) 3px
        );
        pointer-events: none;
      }
    </style>

    <div class="b2-glow"></div>
    <div class="b2-grain"></div>
    <div class="b2-content">
      <div class="b2-tagline">Combat Sports Apparel</div>
      <div class="b2-category">RASHGUARDS<br>SHORTS<br>HOODIES</div>
      <div class="b2-divider"></div>
      <div class="b2-subtitle">Inspired By The Fight</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Tagline drops in
      tl.fromTo('.b2-tagline',
        { y: -60, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.4, ease: 'power3.out' }, 0.1);

      // Categories slam in with stagger
      tl.fromTo('.b2-category',
        { x: -200, opacity: 0, scale: 1.3 },
        { x: 0, opacity: 1, scale: 1, duration: 0.5, ease: 'expo.out' }, 0.3);

      // Red divider expands
      tl.fromTo('.b2-divider',
        { scaleX: 0 },
        { scaleX: 1, duration: 0.4, ease: 'expo.out' }, 0.6);

      // Subtitle fades in
      tl.fromTo('.b2-subtitle',
        { y: 30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.35, ease: 'power2.out' }, 0.8);

      // Glow builds
      tl.fromTo('.b2-glow',
        { scale: 0.5, opacity: 0 },
        { scale: 1.2, opacity: 1, duration: 1.4, ease: 'sine.out' }, 0);

      // Slow zoom on content
      tl.fromTo('.b2-content',
        { scale: 1.0 },
        { scale: 1.04, duration: 3.0, ease: 'none' }, 0);

      window.__timelines['beat-2'] = tl;
    </script>
  </div>
</template>
