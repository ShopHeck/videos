<template id="beat-4-template">
  <div data-composition-id="beat-4" data-width="1080" data-height="1920">
    <style>
      [data-composition-id="beat-4"] {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        position: relative;
        background: #0a0a0a;
        font-family: 'Arial', sans-serif;
      }
      .b4-glow {
        position: absolute;
        width: 900px;
        height: 900px;
        border-radius: 50%;
        top: 45%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, rgba(220, 38, 38, 0.2) 0%, transparent 70%);
        filter: blur(80px);
      }
      .b4-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        padding: 180px 60px;
        gap: 50px;
        box-sizing: border-box;
      }
      .b4-headline {
        font-size: 80px;
        font-weight: 900;
        color: #DC2626;
        text-align: center;
        letter-spacing: 4px;
        text-transform: uppercase;
      }
      .b4-product {
        width: 100%;
        padding: 30px 40px;
        border: 3px solid #DC2626;
        border-radius: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(220, 38, 38, 0.05);
      }
      .b4-product-name {
        font-size: 48px;
        font-weight: 700;
        color: #ffffff;
        text-transform: uppercase;
      }
      .b4-product-price {
        font-size: 52px;
        font-weight: 900;
        color: #DC2626;
      }
      .b4-from {
        font-size: 32px;
        font-weight: 500;
        color: #666666;
        text-align: center;
        letter-spacing: 4px;
        text-transform: uppercase;
      }
    </style>

    <div class="b4-glow"></div>
    <div class="b4-content">
      <div class="b4-headline">Top Sellers</div>
      <div class="b4-product" data-item="1">
        <span class="b4-product-name">Bangkok Fight Tee</span>
        <span class="b4-product-price">$29.99</span>
      </div>
      <div class="b4-product" data-item="2">
        <span class="b4-product-name">BJJ Rash Guard</span>
        <span class="b4-product-price">$49.99</span>
      </div>
      <div class="b4-product" data-item="3">
        <span class="b4-product-name">Athletic Shorts</span>
        <span class="b4-product-price">$59.99</span>
      </div>
      <div class="b4-from">From $29.99</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Headline drops in
      tl.fromTo('.b4-headline',
        { y: -80, opacity: 0, scale: 1.5 },
        { y: 0, opacity: 1, scale: 1, duration: 0.4, ease: 'expo.out' }, 0.1);

      // Products stagger in from right
      tl.fromTo('[data-item="1"]',
        { x: 200, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.4, ease: 'expo.out' }, 0.3);

      tl.fromTo('[data-item="2"]',
        { x: 200, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.4, ease: 'expo.out' }, 0.5);

      tl.fromTo('[data-item="3"]',
        { x: 200, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.4, ease: 'expo.out' }, 0.7);

      // From price fades in
      tl.fromTo('.b4-from',
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out' }, 0.95);

      // Glow
      tl.fromTo('.b4-glow',
        { scale: 0.5, opacity: 0 },
        { scale: 1.2, opacity: 1, duration: 1.4, ease: 'sine.out' }, 0);

      // Slow zoom
      tl.fromTo('.b4-content',
        { scale: 1.0 },
        { scale: 1.03, duration: 2.8, ease: 'none' }, 0.2);

      window.__timelines['beat-4'] = tl;
    </script>
  </div>
</template>
