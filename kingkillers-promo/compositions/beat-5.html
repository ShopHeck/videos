<template id="beat-5-template">
  <div data-composition-id="beat-5" data-width="1080" data-height="1920">
    <style>
      [data-composition-id="beat-5"] {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        position: relative;
        background: #0a0a0a;
        font-family: 'Arial', sans-serif;
      }
      .b5-glow {
        position: absolute;
        width: 1000px;
        height: 1000px;
        border-radius: 50%;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, rgba(220, 38, 38, 0.3) 0%, transparent 70%);
        filter: blur(80px);
      }
      .b5-glow-2 {
        position: absolute;
        width: 500px;
        height: 500px;
        border-radius: 50%;
        top: 70%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, rgba(220, 38, 38, 0.15) 0%, transparent 70%);
        filter: blur(50px);
      }
      .b5-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        padding: 200px 60px;
        gap: 40px;
        box-sizing: border-box;
      }
      .b5-brand {
        font-size: 140px;
        font-weight: 900;
        color: #ffffff;
        text-align: center;
        letter-spacing: -3px;
        text-transform: uppercase;
        text-shadow: 0 0 60px rgba(220, 38, 38, 0.5);
      }
      .b5-tagline {
        font-size: 40px;
        font-weight: 600;
        color: #888888;
        text-align: center;
        letter-spacing: 4px;
        text-transform: uppercase;
      }
      .b5-cta-btn {
        padding: 36px 100px;
        border-radius: 8px;
        background: #DC2626;
        font-size: 56px;
        font-weight: 900;
        color: #ffffff;
        text-transform: uppercase;
        letter-spacing: 6px;
        box-shadow: 0 8px 40px rgba(220, 38, 38, 0.5);
      }
      .b5-url {
        font-size: 36px;
        font-weight: 500;
        color: #a0a0a0;
        text-align: center;
        padding: 16px 32px;
        border: 2px solid rgba(220, 38, 38, 0.3);
        border-radius: 8px;
        letter-spacing: 2px;
      }
      .b5-crown {
        font-size: 100px;
        color: #DC2626;
        text-align: center;
      }
    </style>

    <div class="b5-glow"></div>
    <div class="b5-glow-2"></div>
    <div class="b5-content">
      <div class="b5-crown"></div>
      <div class="b5-brand">KING KILLERS</div>
      <div class="b5-tagline">Athletic Apparel For Combat Sports</div>
      <div class="b5-cta-btn">SHOP NOW</div>
      <div class="b5-url">kingkillers.co</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Crown drops in
      tl.fromTo('.b5-crown',
        { y: -80, opacity: 0, scale: 2 },
        { y: 0, opacity: 1, scale: 1, duration: 0.4, ease: 'back.out(2)' }, 0.1);

      // KING KILLERS brand slams in
      tl.fromTo('.b5-brand',
        { scale: 3.5, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: 'expo.out' }, 0.2);

      // Tagline fades up
      tl.fromTo('.b5-tagline',
        { y: 30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.35, ease: 'power2.out' }, 0.5);

      // CTA button pops in
      tl.fromTo('.b5-cta-btn',
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: 'back.out(2.5)' }, 0.7);

      // URL slides up
      tl.fromTo('.b5-url',
        { y: 20, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.3, ease: 'power2.out' }, 0.95);

      // Glows
      tl.fromTo('.b5-glow',
        { scale: 0.5, opacity: 0 },
        { scale: 1.2, opacity: 1, duration: 1.5, ease: 'sine.out' }, 0);
      tl.fromTo('.b5-glow-2',
        { scale: 0.6, opacity: 0 },
        { scale: 1.0, opacity: 1, duration: 1.0, ease: 'sine.out' }, 0.3);

      // CTA pulse glow
      tl.fromTo('.b5-cta-btn',
        { boxShadow: '0 8px 40px rgba(220, 38, 38, 0.5)' },
        { boxShadow: '0 12px 70px rgba(220, 38, 38, 0.9)', duration: 0.8, ease: 'sine.inOut' }, 1.2);

      window.__timelines['beat-5'] = tl;
    </script>
  </div>
</template>
