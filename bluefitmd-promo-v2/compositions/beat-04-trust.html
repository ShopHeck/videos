<template id="beat-04-trust-template">
  <div class="trust-root" data-composition-id="beat-04-trust" data-width="1080" data-height="1920" style="position:relative;width:1080px;height:1920px;overflow:hidden;background:#061528;">

    <div class="bg-base" style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 38%, #103a72 0%, #0a2349 50%, #061528 100%);"></div>

    <!-- Peptide chain motif -->
    <svg class="chain" width="1080" height="320" viewBox="0 0 1080 320" style="position:absolute;top:120px;left:0;opacity:0.0;">
      <polyline class="chain-line" points="80,180 230,90 380,200 530,80 680,200 830,90 1000,180" fill="none" stroke="#5BA0F8" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
      <g class="aa">
        <circle cx="80" cy="180" r="20" fill="#6BA8FA"/><circle cx="230" cy="90" r="20" fill="#8FC0FF"/>
        <circle cx="380" cy="200" r="20" fill="#6BA8FA"/><circle cx="530" cy="80" r="22" fill="#BFE2FF"/>
        <circle cx="680" cy="200" r="20" fill="#6BA8FA"/><circle cx="830" cy="90" r="20" fill="#8FC0FF"/>
        <circle cx="1000" cy="180" r="20" fill="#6BA8FA"/>
      </g>
    </svg>

    <div class="content" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:430px 80px 0 80px;text-align:center;">

      <div class="eyebrow" style="font-family:'Inter';font-weight:700;font-size:28px;letter-spacing:0.32em;color:#7FB0FF;text-transform:uppercase;opacity:0;">Not your average peptides</div>

      <div class="head" style="font-family:'Anton';font-size:118px;line-height:0.92;color:#ffffff;text-transform:uppercase;margin-top:18px;opacity:0;">Pharmaceutical<br>Grade</div>

      <!-- checks -->
      <div class="checks" style="margin-top:64px;display:flex;flex-direction:column;gap:26px;width:760px;">
        <div class="row r1" style="display:flex;align-items:center;gap:26px;background:rgba(255,255,255,0.06);border:1px solid rgba(120,170,255,0.25);border-radius:20px;padding:26px 34px;opacity:0;">
          <div class="tick" style="flex:0 0 auto;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#5BA0F8,#2E7DF6);display:flex;align-items:center;justify-content:center;font-family:'Inter';font-weight:800;font-size:34px;color:#fff;">✓</div>
          <div style="font-family:'Inter';font-weight:700;font-size:44px;color:#EAF2FF;text-align:left;">Pharmaceutical grade</div>
        </div>
        <div class="row r2" style="display:flex;align-items:center;gap:26px;background:rgba(255,255,255,0.06);border:1px solid rgba(120,170,255,0.25);border-radius:20px;padding:26px 34px;opacity:0;">
          <div class="tick" style="flex:0 0 auto;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#5BA0F8,#2E7DF6);display:flex;align-items:center;justify-content:center;font-family:'Inter';font-weight:800;font-size:34px;color:#fff;">✓</div>
          <div style="font-family:'Inter';font-weight:700;font-size:44px;color:#EAF2FF;text-align:left;">Third-party lab tested</div>
        </div>
        <div class="row r3" style="display:flex;align-items:center;gap:26px;background:rgba(255,255,255,0.06);border:1px solid rgba(120,170,255,0.25);border-radius:20px;padding:26px 34px;opacity:0;">
          <div class="tick" style="flex:0 0 auto;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#5BA0F8,#2E7DF6);display:flex;align-items:center;justify-content:center;font-family:'Inter';font-weight:800;font-size:34px;color:#fff;">✓</div>
          <div style="font-family:'Inter';font-weight:700;font-size:44px;color:#EAF2FF;text-align:left;">Verified for purity</div>
        </div>
      </div>

      <!-- purity ring -->
      <div class="purity" style="position:relative;margin-top:72px;width:300px;height:300px;opacity:0;">
        <svg width="300" height="300" viewBox="0 0 300 300">
          <circle cx="150" cy="150" r="120" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="18"/>
          <circle class="ring-prog" cx="150" cy="150" r="120" fill="none" stroke="#5BA0F8" stroke-width="18" stroke-linecap="round" transform="rotate(-90 150 150)" style="filter:drop-shadow(0 0 16px rgba(91,160,248,0.7));"/>
        </svg>
        <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;">
          <div class="pct" style="font-family:'Anton';font-size:78px;color:#ffffff;line-height:1;opacity:0;">99%+</div>
          <div style="font-family:'Inter';font-weight:700;font-size:24px;letter-spacing:0.22em;color:#7FB0FF;text-transform:uppercase;margin-top:6px;">Purity</div>
        </div>
      </div>

    </div>

    <style>
      @font-face { font-family:'Anton'; src:url('capture/assets/fonts/anton-latin-400-normal.woff2') format('woff2'); font-weight:400; font-style:normal; font-display:block; }
      @font-face { font-family:'Inter'; src:url('capture/assets/fonts/inter-latin-700-normal.woff2') format('woff2'); font-weight:700; font-style:normal; font-display:block; }
      @font-face { font-family:'Inter'; src:url('capture/assets/fonts/inter-latin-800-normal.woff2') format('woff2'); font-weight:800; font-style:normal; font-display:block; }
    </style>

    <script src="vendor/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      var BEAT = 4.3;
      var scope = "[data-composition-id='beat-04-trust'] ";
      var q = function(s){ return document.querySelector(scope + s); };
      var tl = gsap.timeline({ paused: true });

      tl.fromTo(scope + ".trust-root", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0);

      // chain draw + amino pops
      var cl = q(".chain-line");
      var clen = cl.getTotalLength ? cl.getTotalLength() : 1300;
      gsap.set(cl, { strokeDasharray: clen, strokeDashoffset: clen });
      tl.fromTo(scope + ".chain", { opacity: 0 }, { opacity: 0.35, duration: 0.5 }, 0);
      tl.to(cl, { strokeDashoffset: 0, duration: 1.4, ease: "power1.inOut" }, 0.1);
      var beads = document.querySelectorAll(scope + ".aa circle");
      beads.forEach(function(b, i){ tl.fromTo(b, { scale: 0, transformOrigin: "center" }, { scale: 1, duration: 0.3, ease: "back.out(2)" }, 0.1 + i*0.12); });
      // gentle chain drift
      tl.fromTo(scope + ".chain", { y: 0 }, { y: -14, duration: BEAT, ease: "sine.inOut" }, 0.2);

      // text
      tl.fromTo(scope + ".eyebrow", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.2);
      tl.fromTo(scope + ".head", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.35);

      // checks stagger
      [".r1",".r2",".r3"].forEach(function(sel, i){
        tl.fromTo(scope + sel, { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.8 + i*0.22);
        tl.fromTo(scope + sel + " .tick", { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(2.2)" }, 0.86 + i*0.22);
      });

      // purity ring
      var ring = q(".ring-prog");
      var rlen = 2 * Math.PI * 120;
      gsap.set(ring, { strokeDasharray: rlen, strokeDashoffset: rlen });
      tl.fromTo(scope + ".purity", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.6)" }, 1.6);
      tl.to(ring, { strokeDashoffset: rlen * 0.01, duration: 1.0, ease: "power2.out" }, 1.7);
      tl.fromTo(scope + ".pct", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, 2.5);

      // crossfade out
      tl.to(scope + ".trust-root", { opacity: 0, duration: 0.4, ease: "power2.in" }, BEAT - 0.4);

      window.__timelines["beat-04-trust"] = tl;
    </script>
  </div>
</template>
