<template id="beat-02-problem-template">
  <div class="prob-root" data-composition-id="beat-02-problem" data-width="1080" data-height="1920" style="position:relative;width:1080px;height:1920px;overflow:hidden;background:#06101F;">

    <div class="bg-base" style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%, #0c1a2e 0%, #06101F 60%, #03080F 100%);"></div>
    <div class="streaks" style="position:absolute;inset:0;background:repeating-linear-gradient(0deg, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 5px, rgba(140,180,255,0.03) 6px, rgba(0,0,0,0) 8px);opacity:0.6;"></div>

    <!-- Blue pivot wash -->
    <div class="blue-wash" style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 60%, rgba(46,125,246,0.30) 0%, rgba(46,125,246,0.0) 60%);opacity:0;"></div>

    <div class="content" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 90px;text-align:center;">

      <div class="kicker" style="font-family:'Inter';font-weight:700;font-size:28px;letter-spacing:0.36em;color:#FF6A60;text-transform:uppercase;opacity:0;">The old way</div>

      <div class="head" style="font-family:'Anton';font-size:128px;line-height:0.95;color:#ffffff;text-transform:uppercase;margin-top:26px;opacity:0;">Weeks on the<br><span style="color:#FF4438;">sideline</span></div>

      <!-- Slow recovery bar -->
      <div class="bar-wrap" style="width:780px;margin-top:70px;opacity:0;">
        <div style="display:flex;justify-content:space-between;font-family:'Inter';font-weight:600;font-size:24px;letter-spacing:0.16em;color:#8FA6C4;margin-bottom:16px;">
          <span>WK 1</span><span>WK 2</span><span>WK 3</span><span>WK 4</span><span>WK 5</span><span>WK 6+</span>
        </div>
        <div class="track" style="position:relative;height:26px;border-radius:14px;background:#15233a;overflow:hidden;border:1px solid rgba(255,255,255,0.06);">
          <div class="fill" style="position:absolute;left:0;top:0;height:100%;width:0%;border-radius:14px;background:linear-gradient(90deg,#7a1410,#FF4438);"></div>
        </div>
        <div style="font-family:'Inter';font-weight:600;font-size:24px;letter-spacing:0.2em;color:#FF6A60;text-transform:uppercase;margin-top:16px;text-align:left;">Normal recovery — slow</div>
      </div>

      <!-- cons -->
      <div class="cons" style="margin-top:60px;display:flex;flex-direction:column;gap:18px;align-items:center;">
        <div class="con c1" style="font-family:'Inter';font-weight:600;font-size:42px;color:#D7E2F2;opacity:0;"><span style="color:#FF4438;">✕</span>&nbsp; Lost strength &amp; momentum</div>
        <div class="con c2" style="font-family:'Inter';font-weight:600;font-size:42px;color:#D7E2F2;opacity:0;"><span style="color:#FF4438;">✕</span>&nbsp; Watching from the bench</div>
      </div>

      <!-- pivot -->
      <div class="pivot" style="position:absolute;left:90px;right:90px;bottom:340px;font-family:'Anton';font-size:84px;line-height:1.0;color:#6BA8FA;text-transform:uppercase;opacity:0;text-shadow:0 0 40px rgba(46,125,246,0.5);">But what if you<br>didn't have to wait?</div>

    </div>

    <style>
      @font-face { font-family:'Anton'; src:url('capture/assets/fonts/anton-latin-400-normal.woff2') format('woff2'); font-weight:400; font-style:normal; font-display:block; }
      @font-face { font-family:'Inter'; src:url('capture/assets/fonts/inter-latin-600-normal.woff2') format('woff2'); font-weight:600; font-style:normal; font-display:block; }
      @font-face { font-family:'Inter'; src:url('capture/assets/fonts/inter-latin-700-normal.woff2') format('woff2'); font-weight:700; font-style:normal; font-display:block; }
    </style>

    <script src="vendor/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      var BEAT = 3.7;
      var scope = "[data-composition-id='beat-02-problem'] ";
      var tl = gsap.timeline({ paused: true });

      tl.fromTo(scope + ".prob-root", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0);

      tl.fromTo(scope + ".kicker", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.05);
      tl.fromTo(scope + ".head", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.2);

      tl.fromTo(scope + ".bar-wrap", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.55);
      // slow creeping fill — feels sluggish on purpose
      tl.fromTo(scope + ".fill", { width: "0%" }, { width: "78%", duration: 1.7, ease: "power1.in" }, 0.7);

      tl.fromTo(scope + ".c1", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 1.0);
      tl.fromTo(scope + ".c2", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 1.25);

      // PIVOT — desaturate/blue wash, fade the negatives back, raise the question
      tl.to([scope + ".head", scope + ".bar-wrap", scope + ".cons", scope + ".kicker"], { opacity: 0, y: -20, duration: 0.45, ease: "power2.in" }, 2.05);
      tl.fromTo(scope + ".blue-wash", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 2.1);
      tl.fromTo(scope + ".pivot", { opacity: 0, scale: 0.9, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "back.out(1.5)" }, 2.35);
      tl.to(scope + ".pivot", { scale: 1.04, duration: BEAT - 2.6, ease: "sine.inOut" }, 2.6);

      // scene crossfade out
      tl.to(scope + ".prob-root", { opacity: 0, duration: 0.4, ease: "power2.in" }, BEAT - 0.4);

      window.__timelines["beat-02-problem"] = tl;
    </script>
  </div>
</template>
