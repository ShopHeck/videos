    <div class="speed" style="position:absolute;inset:0;background:repeating-linear-gradient(90deg, rgba(255,255,255,0) 0px, rgba(255,255,255,0) 60px, rgba(255,255,255,0.05) 61px, rgba(255,255,255,0) 64px);opacity:0;"></div>

        <path d="M14 46 C50 16 96 20 110 44 C100 52 60 48 14 46 Z" fill="url(#rev-lg)"/>
        <path d="M14 84 C50 54 96 58 110 82 C100 90 60 86 14 84 Z" fill="url(#rev-lg)"/>
      </svg>
      <div style="font-family:'Inter';font-weight:800;font-size:46px;letter-spacing:-0.02em;color:#ffffff;">Bluefit<span style="color:#BFD9FF;">MD</span></div>

    <div class="title-wrap" style="position:absolute;top:210px;left:0;right:0;text-align:center;padding:0 60px;">

    <!-- Peptide chips -->
    <div class="chips" style="position:absolute;top:760px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:30px;">
      <div class="chip chip-a" style="font-family:'Inter';font-weight:800;font-size:46px;letter-spacing:0.02em;color:#ffffff;padding:22px 44px;border-radius:60px;background:linear-gradient(135deg,#5BA0F8,#1F63D6);box-shadow:0 12px 40px rgba(31,99,214,0.5);opacity:0;white-space:nowrap;">BPC-157</div>
      <div class="plus" style="font-family:'Anton';font-size:80px;color:#ffffff;opacity:0;text-shadow:0 0 30px rgba(255,255,255,0.7);">+</div>
      <div class="chip chip-b" style="font-family:'Inter';font-weight:800;font-size:46px;letter-spacing:0.02em;color:#06234A;padding:22px 44px;border-radius:60px;background:linear-gradient(135deg,#BFE2FF,#6BC0FF);box-shadow:0 12px 40px rgba(107,192,255,0.45);opacity:0;white-space:nowrap;">TB-500</div>
    </div>

    <!-- VIAL -->
    <div class="vial" style="position:absolute;left:50%;bottom:140px;transform:translateX(-50%);width:340px;height:760px;opacity:0;">
      <!-- glow behind -->
      <div class="vglow" style="position:absolute;left:50%;top:50%;width:560px;height:560px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle, rgba(120,180,255,0.55) 0%, rgba(46,125,246,0) 65%);"></div>

      <svg width="340" height="760" viewBox="0 0 340 760" style="position:absolute;inset:0;filter:drop-shadow(0 30px 50px rgba(0,0,0,0.45));">
        <defs>
          <linearGradient id="rev-cap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6FB0FF"/><stop offset="0.5" stop-color="#2E7DF6"/><stop offset="1" stop-color="#1A5BC4"/></linearGradient>
          <linearGradient id="rev-crimp" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9aa4b0"/><stop offset="0.25" stop-color="#eef1f4"/><stop offset="0.5" stop-color="#b9c1cc"/><stop offset="0.75" stop-color="#f4f6f8"/><stop offset="1" stop-color="#8f99a6"/></linearGradient>
          <linearGradient id="rev-glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5a3010"/><stop offset="0.32" stop-color="#a9651f"/><stop offset="0.5" stop-color="#c98a3e"/><stop offset="0.7" stop-color="#9a5a1c"/><stop offset="1" stop-color="#5a3010"/></linearGradient>
        </defs>
        <!-- cap -->
        <rect x="104" y="20" width="132" height="118" rx="20" fill="url(#rev-cap)"/>
        <ellipse cx="170" cy="30" rx="58" ry="13" fill="#8FC0FF" opacity="0.7"/>
        <!-- crimp neck -->
        <rect x="96" y="132" width="148" height="46" rx="6" fill="url(#rev-crimp)"/>
        <!-- glass body -->
        <path d="M86 196 q0 -18 18 -18 h132 q18 0 18 18 v520 q0 22 -22 22 h-124 q-22 0 -22 -22 z" fill="url(#rev-glass)"/>
        <!-- glass highlight -->
        <rect x="104" y="206" width="22" height="500" rx="11" fill="#e9b873" opacity="0.45"/>
        <!-- liquid top line -->
        <rect x="92" y="250" width="156" height="3" fill="#d39a51" opacity="0.5"/>
      </svg>

      <!-- label overlay -->
      <div class="label" style="position:absolute;left:32px;right:32px;top:420px;height:270px;background:#ffffff;border-radius:12px;box-shadow:0 8px 20px rgba(0,0,0,0.18);overflow:hidden;">
        <div style="display:flex;align-items:center;gap:8px;padding:18px 18px 0 18px;">
          <svg width="26" height="26" viewBox="0 0 120 120">
            <defs><linearGradient id="rev-llg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5BA0F8"/><stop offset="1" stop-color="#2E7DF6"/></linearGradient></defs>
            <path d="M14 46 C50 16 96 20 110 44 C100 52 60 48 14 46 Z" fill="url(#rev-llg)"/>
            <path d="M14 84 C50 54 96 58 110 82 C100 90 60 86 14 84 Z" fill="url(#rev-llg)"/>
          </svg>
          <span style="font-family:'Inter';font-weight:800;font-size:24px;color:#0B1322;letter-spacing:-0.02em;">Bluefit<span style="color:#2E7DF6;">MD</span></span>

        <div style="font-family:'Anton';font-size:40px;line-height:0.96;color:#2E7DF6;padding:12px 18px 0 18px;">BPC-157 /<br>TB-500</div>
        <div style="font-family:'Inter';font-weight:600;font-size:18px;letter-spacing:0.18em;color:#5b6b80;padding:6px 18px 0 18px;">INJECTION</div>
        <div style="position:absolute;left:0;right:0;bottom:0;background:linear-gradient(90deg,#2E7DF6,#5BA0F8);color:#fff;font-family:'Inter';font-weight:700;font-size:24px;letter-spacing:0.04em;padding:12px 18px;">10mg+10mg/3ml</div>
      </div>

      <!-- moving sheen -->
      <div class="sheen-clip" style="position:absolute;left:32px;right:32px;top:178px;height:560px;border-radius:14px;overflow:hidden;pointer-events:none;">
        <div class="sheen" style="position:absolute;top:-40px;left:-200px;width:120px;height:680px;background:linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.55), rgba(255,255,255,0));transform:skewX(-18deg);"></div>
      </div>
    </div>

    <style>
      @font-face { font-family:'Anton'; src:url('capture/assets/fonts/anton-latin-400-normal.woff2') format('woff2'); font-weight:400; font-style:normal; font-display:block; }
      @font-face { font-family:'Inter'; src:url('capture/assets/fonts/inter-latin-600-normal.woff2') format('woff2'); font-weight:600; font-style:normal; font-display:block; }
      @font-face { font-family:'Inter'; src:url('capture/assets/fonts/inter-latin-700-normal.woff2') format('woff2'); font-weight:700; font-style:normal; font-display:block; }
      @font-face { font-family:'Inter'; src:url('capture/assets/fonts/inter-latin-800-normal.woff2') format('woff2'); font-weight:800; font-style:normal; font-display:block; }
    </style>

    <script src="vendor/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      var BEAT = 4.9;
      var scope = "[data-composition-id='beat-03-reveal'] ";
      var tl = gsap.timeline({ paused: true });

      tl.fromTo(scope + ".rev-root", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0);

      // rays + slow rotate energy
      tl.fromTo(scope + ".rays", { opacity: 0, rotation: -8 }, { opacity: 0.6, rotation: 8, duration: BEAT, ease: "none" }, 0.1);

      // logo
      tl.fromTo(scope + ".logo", { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.1);

      // reveal burst + vial rise + light sweep
      tl.fromTo(scope + ".burst", { opacity: 0, scale: 0.2 }, { opacity: 1, scale: 1.0, duration: 0.18, ease: "power2.out" }, 0.18);
      tl.to(scope + ".burst", { opacity: 0, scale: 2.4, duration: 0.6, ease: "power2.out" }, 0.32);
      tl.fromTo(scope + ".vial", { opacity: 0, y: 120, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "power3.out" }, 0.25);
      tl.fromTo(scope + ".speed", { opacity: 0 }, { opacity: 0.5, duration: 0.2, ease: "power1.out" }, 0.25);
      tl.to(scope + ".speed", { opacity: 0, duration: 0.5, ease: "power1.in" }, 0.5);

      // chips fly in
      tl.fromTo(scope + ".chip-a", { opacity: 0, x: -380, rotation: -12 }, { opacity: 1, x: 0, rotation: 0, duration: 0.5, ease: "power3.out" }, 0.6);
      tl.fromTo(scope + ".chip-b", { opacity: 0, x: 380, rotation: 12 }, { opacity: 1, x: 0, rotation: 0, duration: 0.5, ease: "power3.out" }, 0.6);

      // SNAP together — plus pops, quick squash
      tl.fromTo(scope + ".plus", { opacity: 0, scale: 2.2 }, { opacity: 1, scale: 1, duration: 0.28, ease: "back.out(2.5)" }, 1.12);
      tl.to(scope + ".chips", { keyframes: [{ scale: 0.92, duration: 0.08 }, { scale: 1.06, duration: 0.1 }, { scale: 1.0, duration: 0.12 }], ease: "power2.out" }, 1.1);
      tl.fromTo(scope + ".burst", { opacity: 0, scale: 0.4 }, { opacity: 0.9, scale: 1.6, duration: 0.5, ease: "power2.out" }, 1.1);
      tl.to(scope + ".burst", { opacity: 0, duration: 0.3 }, 1.4);

      // title slam
      tl.fromTo(scope + ".eyebrow", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 1.35);
      tl.fromTo(scope + ".title", { opacity: 0, scale: 1.25, y: 20 }, { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "power3.out" }, 1.45);

      // light sweep across glass
      tl.fromTo(scope + ".sheen", { x: -200 }, { x: 360, duration: 1.0, ease: "power1.inOut" }, 1.5);

      // continuous vial float
      tl.fromTo(scope + ".vial", { y: 0 }, { y: -16, duration: BEAT - 0.9, ease: "sine.inOut" }, 0.9);
      tl.fromTo(scope + ".vglow", { opacity: 0.6, scale: 0.95 }, { opacity: 1, scale: 1.08, duration: 1.6, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0.9);

      // crossfade out
      tl.to(scope + ".rev-root", { opacity: 0, duration: 0.4, ease: "power2.in" }, BEAT - 0.4);

      window.__timelines["beat-03-reveal"] = tl;
    </script>
  </div>
</template>
