<template id="beat-05-payoff-template">
  <div class="pay-root" data-composition-id="beat-05-payoff" data-width="1080" data-height="1920" style="position:relative;width:1080px;height:1920px;overflow:hidden;background:#0A1E3C;">

    <div class="bg-base" style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%, #2E7DF6 0%, #1657C8 42%, #0A2349 78%, #061528 100%);"></div>

    <!-- rushing speed streaks -->
    <div class="streaks" style="position:absolute;inset:0;background:repeating-linear-gradient(115deg, rgba(255,255,255,0) 0px, rgba(255,255,255,0) 70px, rgba(255,255,255,0.07) 72px, rgba(255,255,255,0) 78px);opacity:0;"></div>

    <!-- forward chevrons streaking -->
    <div class="chev" style="position:absolute;left:-200px;top:50%;transform:translateY(-50%);opacity:0;">
      <svg width="520" height="320" viewBox="0 0 520 320">
        <path d="M40 60 L220 160 L40 260 L120 260 L300 160 L120 60 Z" fill="rgba(255,255,255,0.10)"/>
        <path d="M240 60 L420 160 L240 260 L320 260 L500 160 L320 60 Z" fill="rgba(255,255,255,0.08)"/>
      </svg>
    </div>

    <div class="content" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 80px;text-align:center;">

      <div class="eyebrow" style="font-family:'Inter';font-weight:700;font-size:30px;letter-spacing:0.32em;color:#BFD9FF;text-transform:uppercase;opacity:0;">The new way</div>

      <div class="head" style="font-family:'Anton';font-size:158px;line-height:0.9;color:#ffffff;text-transform:uppercase;margin-top:22px;opacity:0;text-shadow:0 8px 50px rgba(0,0,0,0.4);">Back in<br>the gym</div>
      <div class="head2" style="font-family:'Anton';font-size:96px;line-height:0.95;color:#BFE2FF;text-transform:uppercase;margin-top:10px;opacity:0;text-shadow:0 0 40px rgba(120,180,255,0.5);">Faster than ever</div>

      <!-- fast recovery bar -->
      <div class="bar-wrap" style="width:780px;margin-top:80px;opacity:0;">
        <div style="display:flex;justify-content:space-between;font-family:'Inter';font-weight:700;font-size:24px;letter-spacing:0.16em;color:#BFD9FF;margin-bottom:16px;text-transform:uppercase;">
          <span>With the Wolverine Stack</span><span class="pct">100%</span>
        </div>
        <div class="track" style="position:relative;height:30px;border-radius:16px;background:rgba(255,255,255,0.12);overflow:hidden;border:1px solid rgba(255,255,255,0.18);">
          <div class="fill" style="position:absolute;left:0;top:0;height:100%;width:0%;border-radius:16px;background:linear-gradient(90deg,#6BC0FF,#ffffff);box-shadow:0 0 24px rgba(150,200,255,0.8);"></div>
        </div>
        <div class="recovered" style="font-family:'Anton';font-size:48px;letter-spacing:0.06em;color:#ffffff;text-transform:uppercase;margin-top:22px;opacity:0;">Recovered.</div>
      </div>

    </div>

    <style>
      @font-face { font-family:'Anton'; src:url('capture/assets/fonts/anton-latin-400-normal.woff2') format('woff2'); font-weight:400; font-style:normal; font-display:block; }
      @font-face { font-family:'Inter'; src:url('capture/assets/fonts/inter-latin-700-normal.woff2') format('woff2'); font-weight:700; font-style:normal; font-display:block; }
    </style>

    <script src="vendor/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      var BEAT = 3.5;
      var scope = "[data-composition-id='beat-05-payoff'] ";
      var tl = gsap.timeline({ paused: true });

      tl.fromTo(scope + ".pay-root", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 0);

      // streaks rush + chevrons sweep across
      tl.fromTo(scope + ".streaks", { opacity: 0, backgroundPositionX: "0px" }, { opacity: 0.7, backgroundPositionX: "300px", duration: 0.8, ease: "power2.out" }, 0);
      tl.fromTo(scope + ".chev", { opacity: 0, x: -200 }, { opacity: 1, x: 1400, duration: 1.1, ease: "power2.out" }, 0.05);

      // headline slam
      tl.fromTo(scope + ".eyebrow", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 0.1);
      tl.fromTo(scope + ".head", { opacity: 0, scale: 1.3, y: 20 }, { opacity: 1, scale: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.25);
      tl.fromTo(scope + ".head2", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.4, ease: "back.out(1.6)" }, 0.55);

      // fast fill bar (contrast to the slow red one earlier)
      tl.fromTo(scope + ".bar-wrap", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 0.9);
      tl.fromTo(scope + ".fill", { width: "0%" }, { width: "100%", duration: 0.6, ease: "power3.out" }, 1.05);
      tl.fromTo(scope + ".recovered", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2.2)" }, 1.7);

      // continuous push-in
      tl.fromTo(scope + ".content", { scale: 1.0 }, { scale: 1.04, duration: BEAT, ease: "sine.inOut" }, 0);

      // crossfade out
      tl.to(scope + ".pay-root", { opacity: 0, duration: 0.4, ease: "power2.in" }, BEAT - 0.4);

      window.__timelines["beat-05-payoff"] = tl;
    </script>
  </div>
</template>
