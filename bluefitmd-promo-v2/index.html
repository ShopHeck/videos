<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #060B14;
      }
      .scene {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="21.5" data-width="1080" data-height="1920">

      <div id="beat-1" class="scene"
        data-composition-id="beat-01-hook"
        data-composition-src="compositions/beat-01-hook.html"
        data-start="0" data-duration="3.4"
        data-track-index="1"
        data-width="1080" data-height="1920">
      </div>

      <div id="beat-2" class="scene"
        data-composition-id="beat-02-problem"
        data-composition-src="compositions/beat-02-problem.html"
        data-start="3.0" data-duration="3.7"
        data-track-index="2"
        data-width="1080" data-height="1920">
      </div>

      <div id="beat-3" class="scene"
        data-composition-id="beat-03-reveal"
        data-composition-src="compositions/beat-03-reveal.html"
        data-start="6.3" data-duration="4.9"
        data-track-index="3"
        data-width="1080" data-height="1920">
      </div>

      <div id="beat-4" class="scene"
        data-composition-id="beat-04-trust"
        data-composition-src="compositions/beat-04-trust.html"
        data-start="10.8" data-duration="4.3"
        data-track-index="4"
        data-width="1080" data-height="1920">
      </div>

      <div id="beat-5" class="scene"
        data-composition-id="beat-05-payoff"
        data-composition-src="compositions/beat-05-payoff.html"
        data-start="14.7" data-duration="3.5"
        data-track-index="5"
        data-width="1080" data-height="1920">
      </div>

      <div id="beat-6" class="scene"
        data-composition-id="beat-06-cta"
        data-composition-src="compositions/beat-06-cta.html"
        data-start="17.8" data-duration="3.7"
        data-track-index="6"
        data-width="1080" data-height="1920">
      </div>

      <!-- SFX Audio -->
      <audio id="sfx-impact-1"  data-start="0.0"  data-duration="2.12" data-track-index="7"  data-volume="0.45" src="sfx/impact-bass-1.mp3"></audio>
      <audio id="sfx-whoosh-1"  data-start="2.7"  data-duration="5.54" data-track-index="8"  data-volume="0.25" src="sfx/whoosh-cinematic.mp3"></audio>
      <audio id="sfx-impact-2"  data-start="6.4"  data-duration="2.12" data-track-index="9"  data-volume="0.35" src="sfx/impact-bass-1.mp3"></audio>
      <audio id="sfx-chime-1"   data-start="6.6"  data-duration="2.50" data-track-index="10" data-volume="0.35" src="sfx/chime.mp3"></audio>
      <audio id="sfx-chime-2"   data-start="11.0" data-duration="2.50" data-track-index="11" data-volume="0.30" src="sfx/chime.mp3"></audio>
      <audio id="sfx-whoosh-2"  data-start="14.4" data-duration="5.54" data-track-index="12" data-volume="0.25" src="sfx/whoosh-cinematic.mp3"></audio>
      <audio id="sfx-sparkle"   data-start="17.9" data-duration="1.80" data-track-index="13" data-volume="0.40" src="sfx/sparkle.mp3"></audio>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
