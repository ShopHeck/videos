<template id="beat-4-template">
  <div data-composition-id="beat-4" data-width="1080" data-height="1920">
    <style>
      [data-composition-id="beat-4"] {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        position: relative;
        background: #0a0a0a;
        font-family: 'Arial', sans-serif;
      }
      .b4-glow {
        position: absolute;
        width: 900px;
        height: 900px;
        border-radius: 50%;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, rgba(108, 180, 238, 0.15) 0%, transparent 70%);
        filter: blur(80px);
      }
      .b4-content {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        width: 100%;
        padding: 0 60px;
        box-sizing: border-box;
      }
      .b4-shield {
        position: absolute;
        top: 20%;
        left: 50%;
        transform: translateX(-50%);
        width: 160px;
        height: 180px;
      }
      .b4-shield-icon {
        width: 160px;
        height: 180px;
        position: relative;
      }
      .b4-shield-bg {
        width: 140px;
        height: 160px;
        margin: 0 auto;
        background: linear-gradient(180deg, rgba(108, 180, 238, 0.2) 0%, rgba(108, 180, 238, 0.05) 100%);
        border: 3px solid rgba(108, 180, 238, 0.5);
        border-radius: 70px 70px 10px 10px;
        clip-path: polygon(50% 0%, 100% 15%, 100% 70%, 50% 100%, 0% 70%, 0% 15%);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 40px rgba(108, 180, 238, 0.2);
      }
      .b4-checkmark {
        font-size: 70px;
        color: #6CB4EE;
        font-weight: 900;
        text-shadow: 0 0 20px rgba(108, 180, 238, 0.6);
      }
      .b4-headline {
        font-size: 100px;
        font-weight: 900;
        color: #ffffff;
        line-height: 1.1;
        letter-spacing: -2px;
        text-transform: uppercase;
      }
      .b4-subtext {
        font-size: 44px;
        font-weight: 500;
        color: #6CB4EE;
        margin-top: 40px;
        letter-spacing: 1px;
        line-height: 1.4;
      }
      .b4-badge {
        display: inline-block;
        margin-top: 50px;
        padding: 16px 40px;
        border: 2px solid rgba(108, 180, 238, 0.5);
        border-radius: 50px;
        font-size: 32px;
        font-weight: 700;
        color: #6CB4EE;
        letter-spacing: 3px;
        text-transform: uppercase;
      }
      .b4-scanlines {
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 3px,
          rgba(108, 180, 238, 0.015) 3px,
          rgba(108, 180, 238, 0.015) 4px
        );
        pointer-events: none;
      }
    </style>

    <div class="b4-glow"></div>
    <div class="b4-scanlines"></div>
    <div class="b4-shield">
      <div class="b4-shield-icon">
        <div class="b4-shield-bg">
          <div class="b4-checkmark">&#10003;</div>
        </div>
      </div>
    </div>
    <div class="b4-content">
      <div class="b4-headline">PHARMA-<br>CEUTICAL<br>GRADE</div>
      <div class="b4-subtext">Every batch quality tested<br>for purity</div>
      <div class="b4-badge">Lab Verified</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Shield scales in with authority
      tl.fromTo('.b4-shield',
        { scale: 0, opacity: 0, rotation: -10 },
        { scale: 1, opacity: 1, rotation: 0, duration: 0.5, ease: 'back.out(1.6)' }, 0.1);

      // Headline fades and scales
      tl.fromTo('.b4-headline',
        { scale: 2.5, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: 'expo.out' }, 0.25);

      // Subtext slides up
      tl.fromTo('.b4-subtext',
        { y: 50, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.4, ease: 'power3.out' }, 0.6);

      // Badge pops in
      tl.fromTo('.b4-badge',
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.35, ease: 'back.out(2)' }, 0.9);

      // Glow pulse
      tl.fromTo('.b4-glow',
        { scale: 0.5, opacity: 0 },
        { scale: 1.2, opacity: 1, duration: 1.8, ease: 'sine.out' }, 0);

      // Slow zoom
      tl.fromTo('.b4-content',
        { scale: 1.0 },
        { scale: 1.04, duration: 3.0, ease: 'none' }, 0.1);

      window.__timelines['beat-4'] = tl;
    </script>
  </div>
</template>
