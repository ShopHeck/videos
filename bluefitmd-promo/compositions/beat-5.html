<template id="beat-5-template">
  <div data-composition-id="beat-5" data-width="1080" data-height="1920">
    <style>
      [data-composition-id="beat-5"] {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        position: relative;
        background: #0a0a0a;
        font-family: 'Arial', sans-serif;
      }
      .b5-glow {
        position: absolute;
        width: 1200px;
        height: 1200px;
        border-radius: 50%;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, rgba(108, 180, 238, 0.25) 0%, transparent 60%);
        filter: blur(120px);
      }
      .b5-glow-2 {
        position: absolute;
        width: 600px;
        height: 600px;
        border-radius: 50%;
        top: 60%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, rgba(108, 180, 238, 0.15) 0%, transparent 70%);
        filter: blur(60px);
      }
      .b5-content {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        width: 100%;
        padding: 0 60px;
        box-sizing: border-box;
      }
      .b5-brand {
        font-size: 90px;
        font-weight: 900;
        color: #ffffff;
        letter-spacing: -2px;
        margin-bottom: 20px;
      }
      .b5-brand-accent {
        color: #6CB4EE;
      }
      .b5-cta-button {
        display: inline-block;
        margin-top: 50px;
        padding: 30px 80px;
        background: linear-gradient(135deg, #6CB4EE, #4a9edc);
        border-radius: 60px;
        font-size: 52px;
        font-weight: 800;
        color: #ffffff;
        letter-spacing: 4px;
        text-transform: uppercase;
        box-shadow: 0 0 50px rgba(108, 180, 238, 0.5), 0 10px 40px rgba(0, 0, 0, 0.3);
      }
      .b5-url {
        font-size: 44px;
        font-weight: 600;
        color: #6CB4EE;
        margin-top: 50px;
        letter-spacing: 2px;
      }
      .b5-tagline {
        font-size: 36px;
        font-weight: 500;
        color: #8a9bae;
        margin-top: 30px;
        letter-spacing: 1px;
      }
      .b5-logo-area {
        margin-bottom: 30px;
      }
      .b5-logo-text {
        font-size: 48px;
        font-weight: 700;
        color: #6CB4EE;
        letter-spacing: 3px;
      }
      .b5-scanlines {
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 3px,
          rgba(108, 180, 238, 0.015) 3px,
          rgba(108, 180, 238, 0.015) 4px
        );
        pointer-events: none;
      }
      .b5-particles {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .b5-particle {
        position: absolute;
        width: 6px;
        height: 6px;
        background: #6CB4EE;
        border-radius: 50%;
        opacity: 0;
      }
      .b5-p1 { top: 30%; left: 20%; }
      .b5-p2 { top: 25%; right: 25%; }
      .b5-p3 { top: 70%; left: 15%; }
      .b5-p4 { top: 65%; right: 20%; }
      .b5-p5 { top: 45%; left: 10%; }
      .b5-p6 { top: 50%; right: 12%; }
    </style>

    <div class="b5-glow"></div>
    <div class="b5-glow-2"></div>
    <div class="b5-scanlines"></div>
    <div class="b5-particles">
      <div class="b5-particle b5-p1"></div>
      <div class="b5-particle b5-p2"></div>
      <div class="b5-particle b5-p3"></div>
      <div class="b5-particle b5-p4"></div>
      <div class="b5-particle b5-p5"></div>
      <div class="b5-particle b5-p6"></div>
    </div>
    <div class="b5-content">
      <div class="b5-logo-area">
        <div class="b5-logo-text">BLUEFITMD</div>
      </div>
      <div class="b5-brand">Blue<span class="b5-brand-accent">Fit</span>MD</div>
      <div class="b5-tagline">Recovery Science, Delivered</div>
      <div class="b5-cta-button">SHOP NOW</div>
      <div class="b5-url">bluefitmd.com</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Brand name scales in
      tl.fromTo('.b5-brand',
        { scale: 3, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: 'expo.out' }, 0.1);

      // Logo text fades
      tl.fromTo('.b5-logo-text',
        { opacity: 0, y: -30 },
        { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out' }, 0.3);

      // Tagline
      tl.fromTo('.b5-tagline',
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out' }, 0.5);

      // CTA button bounces in
      tl.fromTo('.b5-cta-button',
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: 'back.out(2.2)' }, 0.7);

      // CTA pulse animation
      tl.to('.b5-cta-button',
        { boxShadow: '0 0 80px rgba(108, 180, 238, 0.8), 0 10px 40px rgba(0, 0, 0, 0.3)',
          scale: 1.05, duration: 0.5, ease: 'sine.inOut', yoyo: true, repeat: 3 }, 1.0);

      // URL fades in
      tl.fromTo('.b5-url',
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out' }, 0.9);

      // Particles float up
      tl.fromTo('.b5-p1', { opacity: 0, y: 20 }, { opacity: 0.6, y: -30, duration: 2, ease: 'sine.out' }, 0.3);
      tl.fromTo('.b5-p2', { opacity: 0, y: 30 }, { opacity: 0.5, y: -40, duration: 2.2, ease: 'sine.out' }, 0.4);
      tl.fromTo('.b5-p3', { opacity: 0, y: 20 }, { opacity: 0.4, y: -25, duration: 1.8, ease: 'sine.out' }, 0.5);
      tl.fromTo('.b5-p4', { opacity: 0, y: 25 }, { opacity: 0.6, y: -35, duration: 2.1, ease: 'sine.out' }, 0.3);
      tl.fromTo('.b5-p5', { opacity: 0, y: 15 }, { opacity: 0.5, y: -20, duration: 1.9, ease: 'sine.out' }, 0.6);
      tl.fromTo('.b5-p6', { opacity: 0, y: 20 }, { opacity: 0.4, y: -30, duration: 2.0, ease: 'sine.out' }, 0.5);

      // Glow expands
      tl.fromTo('.b5-glow',
        { scale: 0.4, opacity: 0 },
        { scale: 1.3, opacity: 1, duration: 2.0, ease: 'sine.out' }, 0);

      tl.fromTo('.b5-glow-2',
        { scale: 0.5, opacity: 0 },
        { scale: 1.1, opacity: 1, duration: 1.5, ease: 'sine.out' }, 0.2);

      window.__timelines['beat-5'] = tl;
    </script>
  </div>
</template>
