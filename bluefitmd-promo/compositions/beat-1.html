<template id="beat-1-template">
  <div data-composition-id="beat-1" data-width="1080" data-height="1920">
    <style>
      [data-composition-id="beat-1"] {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        position: relative;
        background: #0a0a0a;
        font-family: 'Arial', sans-serif;
      }
      .b1-flash {
        position: absolute;
        inset: 0;
        background: #6CB4EE;
        opacity: 0;
      }
      .b1-glow {
        position: absolute;
        width: 1000px;
        height: 1000px;
        border-radius: 50%;
        top: 45%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, rgba(108, 180, 238, 0.35) 0%, transparent 70%);
        filter: blur(100px);
      }
      .b1-glow-2 {
        position: absolute;
        width: 600px;
        height: 600px;
        border-radius: 50%;
        top: 65%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, rgba(108, 180, 238, 0.2) 0%, transparent 70%);
        filter: blur(60px);
      }
      .b1-grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(108, 180, 238, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(108, 180, 238, 0.04) 1px, transparent 1px);
        background-size: 80px 80px;
      }
      .b1-content {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        width: 100%;
        padding: 0 60px;
        box-sizing: border-box;
      }
      .b1-headline {
        font-size: 120px;
        font-weight: 900;
        color: #ffffff;
        line-height: 1.1;
        letter-spacing: -3px;
        text-transform: uppercase;
        text-shadow: 0 0 60px rgba(108, 180, 238, 0.4);
      }
      .b1-headline-accent {
        color: #6CB4EE;
      }
      .b1-subtitle {
        font-size: 48px;
        font-weight: 500;
        color: #8a9bae;
        margin-top: 40px;
        letter-spacing: 2px;
      }
      .b1-scanlines {
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 3px,
          rgba(108, 180, 238, 0.015) 3px,
          rgba(108, 180, 238, 0.015) 4px
        );
        pointer-events: none;
      }
      .b1-vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.6) 100%);
        pointer-events: none;
      }
    </style>

    <div class="b1-glow"></div>
    <div class="b1-glow-2"></div>
    <div class="b1-grid"></div>
    <div class="b1-scanlines"></div>
    <div class="b1-flash"></div>
    <div class="b1-content">
      <div class="b1-headline">SIDELINED<br>BY AN<br><span class="b1-headline-accent">INJURY?</span></div>
      <div class="b1-subtitle">Every day out is a day lost</div>
    </div>
    <div class="b1-vignette"></div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Blue flash on entry
      tl.fromTo('.b1-flash', { opacity: 0.8 }, { opacity: 0, duration: 0.3, ease: 'power2.out' }, 0.05);

      // Headline SLAMS in from massive scale
      tl.fromTo('.b1-headline',
        { scale: 4, opacity: 0, rotation: -2 },
        { scale: 1, opacity: 1, rotation: 0, duration: 0.6, ease: 'expo.out' }, 0.1);

      // Subtitle fades up
      tl.fromTo('.b1-subtitle',
        { y: 60, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.4, ease: 'power3.out' }, 0.6);

      // Glow pulses in
      tl.fromTo('.b1-glow',
        { scale: 0.3, opacity: 0 },
        { scale: 1.3, opacity: 1, duration: 1.8, ease: 'sine.out' }, 0);

      tl.fromTo('.b1-glow-2',
        { scale: 0.5, opacity: 0 },
        { scale: 1.1, opacity: 1, duration: 1.2, ease: 'sine.out' }, 0.2);

      // Slow zoom on content
      tl.fromTo('.b1-content',
        { scale: 1.0 },
        { scale: 1.06, duration: 3.0, ease: 'none' }, 0.1);

      window.__timelines['beat-1'] = tl;
    </script>
  </div>
</template>
