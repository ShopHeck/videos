<template id="beat-2-template">
  <div data-composition-id="beat-2" data-width="1080" data-height="1920">
    <style>
      [data-composition-id="beat-2"] {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        position: relative;
        background: #0a0a0a;
        font-family: 'Arial', sans-serif;
      }
      .b2-glow {
        position: absolute;
        width: 800px;
        height: 800px;
        border-radius: 50%;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, rgba(108, 180, 238, 0.25) 0%, transparent 70%);
        filter: blur(80px);
      }
      .b2-content {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        width: 100%;
        padding: 0 60px;
        box-sizing: border-box;
      }
      .b2-label {
        font-size: 42px;
        font-weight: 600;
        color: #6CB4EE;
        text-transform: uppercase;
        letter-spacing: 8px;
        margin-bottom: 30px;
      }
      .b2-headline {
        font-size: 100px;
        font-weight: 900;
        color: #ffffff;
        line-height: 1.1;
        letter-spacing: -2px;
        text-transform: uppercase;
        text-shadow: 0 0 40px rgba(108, 180, 238, 0.3);
      }
      .b2-peptides {
        font-size: 60px;
        font-weight: 700;
        color: #6CB4EE;
        margin-top: 40px;
        letter-spacing: 4px;
      }
      .b2-subtitle {
        font-size: 38px;
        font-weight: 500;
        color: #8a9bae;
        margin-top: 30px;
        letter-spacing: 2px;
      }
      .b2-vial {
        position: absolute;
        top: 18%;
        left: 50%;
        transform: translateX(-50%);
        width: 120px;
        height: 220px;
      }
      .b2-vial-body {
        width: 100px;
        height: 160px;
        margin: 0 auto;
        background: linear-gradient(180deg, #1a3a5c 0%, #0d2240 100%);
        border-radius: 8px;
        border: 2px solid rgba(108, 180, 238, 0.4);
        position: relative;
        box-shadow: 0 0 30px rgba(108, 180, 238, 0.2), inset 0 0 20px rgba(108, 180, 238, 0.1);
      }
      .b2-vial-cap {
        width: 60px;
        height: 30px;
        margin: 0 auto;
        background: linear-gradient(180deg, #6CB4EE, #4a9edc);
        border-radius: 6px 6px 0 0;
        box-shadow: 0 0 15px rgba(108, 180, 238, 0.4);
      }
      .b2-vial-label {
        position: absolute;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 70px;
        height: 50px;
        background: rgba(255, 255, 255, 0.9);
        border-radius: 4px;
      }
      .b2-vial-label-text {
        font-size: 10px;
        font-weight: 700;
        color: #0a0a0a;
        text-align: center;
        padding-top: 12px;
        line-height: 1.3;
      }
      .b2-scanlines {
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 3px,
          rgba(108, 180, 238, 0.015) 3px,
          rgba(108, 180, 238, 0.015) 4px
        );
        pointer-events: none;
      }
    </style>

    <div class="b2-glow"></div>
    <div class="b2-scanlines"></div>
    <div class="b2-vial">
      <div class="b2-vial-cap"></div>
      <div class="b2-vial-body">
        <div class="b2-vial-label">
          <div class="b2-vial-label-text">BPC-157<br>TB-500</div>
        </div>
      </div>
    </div>
    <div class="b2-content">
      <div class="b2-label">Introducing</div>
      <div class="b2-headline">THE<br>WOLVERINE<br>STACK</div>
      <div class="b2-peptides">BPC-157 + TB-500</div>
      <div class="b2-subtitle">Recovery Peptide Combo</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Vial drops in from top
      tl.fromTo('.b2-vial',
        { y: -300, opacity: 0, scale: 0.5 },
        { y: 0, opacity: 1, scale: 1, duration: 0.5, ease: 'back.out(1.4)' }, 0.1);

      // Label fades in
      tl.fromTo('.b2-label',
        { opacity: 0, y: -30 },
        { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out' }, 0.3);

      // Headline slams in
      tl.fromTo('.b2-headline',
        { scale: 3.5, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: 'expo.out' }, 0.4);

      // Peptide names stagger in
      tl.fromTo('.b2-peptides',
        { x: -100, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.4, ease: 'back.out(1.8)' }, 0.7);

      // Subtitle
      tl.fromTo('.b2-subtitle',
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.3, ease: 'power2.out' }, 0.95);

      // Glow pulse
      tl.fromTo('.b2-glow',
        { scale: 0.4, opacity: 0 },
        { scale: 1.2, opacity: 1, duration: 1.6, ease: 'sine.out' }, 0);

      // Slow zoom
      tl.fromTo('.b2-content',
        { scale: 1.0 },
        { scale: 1.04, duration: 3.0, ease: 'none' }, 0.1);

      window.__timelines['beat-2'] = tl;
    </script>
  </div>
</template>
